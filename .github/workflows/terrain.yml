name: Préparer le terrain

on:
  push:
    paths:
      - "scripts/build_terrain.py"
      - ".github/workflows/terrain.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: terrain
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install numpy requests rasterio shapely
      - name: Calcul des couches
        id: build
        continue-on-error: true
        run: python scripts/build_terrain.py
      - name: Enregistrer les données
        if: always()
        run: |
          git config user.name "sous-bois-bot"
          git config user.email "sous-bois-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Couches de terrain : $(date -u +%F) (${{ steps.build.outcome }})"
          git pull --rebase -q
          git push
      - name: Republier le site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
