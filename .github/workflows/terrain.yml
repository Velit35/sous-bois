name: Préparer le terrain

on:
  push:
    paths:
      - "scripts/build_terrain.py"
      - "scripts/common.py"
      - ".github/workflows/terrain.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terrain
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          pip install "numpy<2" scipy requests rasterio shapely pillow
          pip install pysheds || echo "pysheds non installé"
      - name: Calcul des couches
        id: build
        continue-on-error: true
        run: python scripts/build_terrain.py
      - name: Enregistrer les données
        if: always()
        run: |
          scripts/commit.sh "Couches de terrain : $(date -u +%F) (${{ steps.build.outcome }})"
