name: Météo de la nuit

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_run:
    workflows: ["Préparer le terrain"]
    types: [completed]
  push:
    paths:
      - "scripts/build_meteo.py"
      - ".github/workflows/meteo.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meteo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy requests shapely
      - name: Calcul de la météo
        id: build
        run: python scripts/build_meteo.py
      - name: Publier sur la branche « meteo » (sans historique, pour ne pas alourdir le dépôt)
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/meteo && cp data/meteo.json data/meteo-log.txt /tmp/meteo/
          cd /tmp/meteo
          git init -q -b meteo
          git config user.name "sous-bois-bot"
          git config user.email "sous-bois-bot@users.noreply.github.com"
          git add . && git commit -q -m "Météo du $(date -u +'%F %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" meteo
