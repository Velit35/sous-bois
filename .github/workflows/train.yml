name: Apprendre des observations

on:
  workflow_run:
    workflows: ["Préparer le terrain"]
    types: [completed]
  push:
    paths:
      - "data/perso/**"
      - "scripts/train_model.py"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy requests scikit-learn
      - name: Entraînement
        id: build
        continue-on-error: true
        env:
          # La météo des observations ne se télécharge qu'au calcul quotidien (quota gratuit d'Open-Meteo) ;
          # les autres déclenchements réentraînent seulement avec ce qui est en cache.
          BUDGET: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '330' || '0' }}
        run: python scripts/train_model.py
      - name: Enregistrer
        if: always()
        run: |
          scripts/commit.sh "Modèle appris : $(date -u +%F) (${{ steps.build.outcome }})"
